
<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BTS X ARMY ♡ 行程規劃</title>
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=M+PLUS+Rounded+1c:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- ===== ♡ Leaflet 地圖樣式 ===== -->
    <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
>
    <link rel="stylesheet" href="style.css?v=44">
</head>
<body>



    <div class="container">

        <header class="header">
            <div class="logo">♡ BTS X ARMY ♡</div>
            <p>추운 겨울 끝을 지나, 다시 봄날이 올 때까지</p>
        </header>

        <section class="trip-card">

    <!-- ♡ 全站編輯模式按鈕 ♡ -->
    <button type="button"
            id="globalEditModeButton"
            class="edit-mode-button"
            title="切換全站編輯模式"
            aria-label="切換全站編輯模式">
        ✎
    </button>

    <div class="trip-label">MY TRAVEL DIARY</div>
    <h1>我的旅遊行程</h1>
    <p>記錄與防彈美好的旅程 ♡</p>

<div class="trip-info">
    <span id="tripDateDisplay">📅 2026.11.19 - 11.22</span>
    <span id="tripDestinationDisplay">📍 高雄</span>
</div>

<button id="editTripButton" class="edit-trip-button">
    ✎ 編輯旅遊資料
</button>

        </section>

        
<!-- ===== PinkPlanner 主功能分頁 ===== -->
<div class="main-tabs">
    <button id="scheduleTab" class="main-tab active">
        ♡ 每日行程
    </button>

    <button id="checklistTab" class="main-tab">
        ♡ 打卡清單
    </button>

    <button id="mapTab" class="main-tab">
    ♡ 地圖
    </button>
</div>

<!-- ===== ♡ 地圖分頁內容 ===== -->
<section id="mapSection" style="display: none;">
    <!-- ===== ♡ ARMY 我的目前位置 ===== -->
<div class="army-location-box">
    <label for="armyLocationUrl">
        ♡ 我的目前位置
    </label>

    <input
        type="url"
        id="armyLocationUrl"
        placeholder="貼上 Google Maps 位置網址"
    >

<button type="button" id="armyLocationButton" title="定位我的位置" aria-label="定位我的位置">
    📍
</button>
</div>
    <div id="checklistMap"></div>
</section>

<!-- ===== 打卡清單分頁內容 ===== -->
<section id="checklistSection" class="checklist-section" style="display: none;">

<h2>♡ 我的打卡清單</h2>

<p>把想去的景點和拍照點收藏在這裡。</p>

<div id="checklistGroups"></div>

    <button id="addChecklistButton" class="add-button">
        ＋ 新增打卡清單
    </button>

</section>


<!-- ===== 新增打卡清單視窗 ===== -->
<div id="checklistModal" class="modal">
    <div class="modal-content">

        <h2>♡ 新增打卡清單</h2>

        <label for="checklistName">景點或區域名稱</label>
        <input
            type="text"
            id="checklistName"
            placeholder="例如：駁二藝術特區"
        >

        <button type="button" id="saveChecklistButton">
            ♡ 儲存清單
        </button>

        <button type="button" id="closeChecklistButton">
            取消
        </button>

    </div>
</div>


<!-- ===== 新增打卡點視窗 ===== -->
<div id="checklistItemModal" class="modal">
    <div class="modal-content">

        <h2>♡ 新增打卡點</h2>

        <label for="checklistItemName">名稱</label>
        <input type="text" id="checklistItemName"
               placeholder="例如：蓬萊倉庫">

<!-- ===== ♡ 打卡點交通資訊 ===== -->

<label for="checklistItemTransport">交通方式</label>
<select id="checklistItemTransport">
    <option value="">不需要交通資訊</option>
    <option value="步行">🚶 步行</option>
    <option value="捷運">🚇 捷運</option>
    <option value="輕軌">🚈 輕軌</option>
    <option value="火車">🚆 火車</option>
    <option value="高鐵">🚄 高鐵</option>
    <option value="公車">🚌 公車</option>
    <option value="飛機">✈️ 飛機</option>
    <option value="計程車">🚕 計程車</option>
    <option value="其他">🚗 其他</option>
</select>

<label for="checklistTransportTo">地點</label>
<input
    type="text"
    id="checklistTransportTo"
    placeholder="例如：巨蛋站"
>

<label for="checklistTransportRoute">交通路線</label>
<input
    type="text"
    id="checklistTransportRoute"
    placeholder="例如：高雄捷運紅線"
>
<!-- ===== ♡ 打卡點圖片上傳 ===== -->
<label for="checklistItemImage">打卡點圖片</label>
<input
    type="file"
    id="checklistItemImage"
    accept="image/*"
>
<!-- ===== ♡ 已上傳圖片預覽 ===== -->
<div id="checklistExistingImageBox"
     style="display: none; margin-top: 12px;">

    <p style="font-size: 13px; color: #c66d9a;">
        ♡ 目前已上傳的圖片
    </p>

    <div class="checklist-image-preview-wrapper">

        <img
            id="checklistExistingImage"
            alt="已上傳的打卡點圖片"
        >

        <button
            type="button"
            id="deleteChecklistImageButton"
            title="刪除照片"
            aria-label="刪除照片"
        >×</button>

    </div>

</div>
<!-- ===== ♡ 打卡點 Google Maps ===== -->
<label for="checklistItemMapUrl">Google Maps</label>
<input
    type="url"
    id="checklistItemMapUrl"
    placeholder="貼上 Google Maps 網址"
>
<!-- ===== ♡ 打卡點店家／社群平台 ===== -->

<label for="checklistItemShopPlatform">店家／社群平台</label>
<select id="checklistItemShopPlatform">
    <option value="instagram">Instagram</option>
    <option value="facebook">Facebook</option>
    <option value="threads">Threads</option>
    <option value="website">店家官網</option>
    <option value="other">其他連結</option>
</select>

<label for="checklistItemShopInfo">平台網址</label>
<input
    type="url"
    id="checklistItemShopInfo"
    placeholder="https://..."
>

        <label for="checklistItemNote">備註</label>
        <textarea id="checklistItemNote"
                  placeholder="例如：想拍照的角度、注意事項"></textarea>

        <button type="button" id="saveChecklistItemButton">
            ♡ 儲存打卡點
        </button>

        <button type="button" id="closeChecklistItemButton">
            取消
        </button>

    </div>
</div>




        <section class="schedule-section">

    <div id="dateTabs"></div>

            <div id="scheduleList">
            <p class="empty-message">還沒有行程喔，新增一筆吧！ ♡</p>
            </div>

            <button class="add-button">＋ 新增行程</button>
            <div id="addModal" class="modal">
            <div class="modal-content">
            <h2 id="modalTitle">♡ 新增我的行程</h2>

            <label>日期</label>
            <input type="date" id="eventDate">

            <label>時間</label>
            <input type="time" id="eventTime"><section class="schedule-section">

            <label>行程名稱</label>
            <input type="text" id="eventTitle" placeholder="今天要去哪裡呢？">

            <label>地點</label>
            <input type="text" id="eventPlace" placeholder="輸入地點">


            <!-- ===== 交通資訊 ===== -->

            <label>交通方式</label>
            <select id="eventTransport">
            <option value="">不需要交通資訊</option>
            <option value="步行">🚶 步行</option>
            <option value="捷運">🚇 捷運</option>
            <option value="輕軌">🚈 輕軌</option>
            <option value="火車">🚆 火車</option>
            <option value="高鐵">🚄 高鐵</option>
            <option value="公車">🚌 公車</option>
            <option value="飛機">✈️ 飛機</option>
            <option value="計程車">🚕 計程車</option>
            <option value="其他">🚗 其他</option>
        </select>

        <label>出發站／地點</label>
        <input type="text" id="transportFrom"
        placeholder="例如：左營站">

        <label>抵達站／地點</label>
        <input type="text" id="transportTo"
        placeholder="例如：巨蛋站">

        <label>交通路線</label>
        <input type="text" id="transportRoute"
        placeholder="例如：高雄捷運紅線">

<!-- ===== ♡ Google Maps 地圖連結 ===== -->
<label for="eventMapUrl">Google Maps</label>
<input
    type="url"
    id="eventMapUrl"
    placeholder="貼上 Google Maps 網址"
>

<!-- ===== ♡ 店家／社群平台 ===== -->
<label for="eventShopPlatform">店家／社群平台</label>
<select id="eventShopPlatform">
    <option value="instagram">Instagram</option>
    <option value="facebook">Facebook</option>
    <option value="threads">Threads</option>
    <option value="website">店家官網</option>
    <option value="other">其他連結</option>
</select>

<label for="eventShopInfo">平台網址</label>
<input
    type="url"
    id="eventShopInfo"
    placeholder="https://..."
>
            <label>備註</label>
            <textarea id="eventNote" placeholder="記錄一些小事情 ♡"></textarea>

            <button id="saveEvent">儲存行程</button>
            <button id="closeModal">取消</button>
        </div>
    </div>
        </section>

<!-- ===== ♡ 打卡點圖片預覽視窗 ===== -->
<div id="checklistImageModal" class="modal">
    <div class="modal-content">

        <button
            type="button"
            id="closeChecklistImageButton">
            ×
        </button>

        <img
            id="checklistImagePreview"
            alt="打卡點圖片"
            style="width:100%; max-height:70vh; object-fit:contain;"
        >

    </div>
</div>

<!-- ===== 編輯旅遊資料視窗 ===== -->

<div id="tripModal" class="modal">
    <div class="modal-content">

        <h2>♡ 編輯旅遊資料</h2>

        <label>旅遊名稱</label>
        <input
            type="text"
            id="tripName"
            placeholder="例如：高雄四天三夜 ♡"
        >

        <label>旅遊目的地</label>
        <input
            type="text"
            id="tripDestination"
            placeholder="例如：高雄"
        >

        <label>開始日期</label>
        <input type="date" id="tripStartDate">

        <label>結束日期</label>
        <input type="date" id="tripEndDate">

        <button id="saveTripButton">儲存旅遊資料</button>
        <button id="closeTripButton">取消</button>

    </div>
</div>

        <footer>
            Made with ♡ by KaKa @chukai.67
        </footer>

    </div>


</body>
<!-- ===== ♡ Leaflet 地圖功能 ===== -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="script.js?v=46"></script>
</html>
